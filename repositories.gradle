// Add any additional repositories for your dependencies here

repositories {
    maven {
        name 'Cleanroom Maven'
        url 'https://maven.cleanroommc.com'
    }
    maven {
        name = "ic2"
        url = "https://maven.ic2.player.to/"
    }

    ivy {
        url "https://github.com/SabrePenguin/Horizon-QA/releases/download/"
        patternLayout {
            artifact("0.6.1/HorizonQA-0.6.1.jar")
        }

        metadataSources {
            artifact()
        }
    }
}
